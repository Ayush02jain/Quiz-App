<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}QuizApp{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;
  --border:#2e3347;--text:#e8eaf0;--muted:#6b7280;
  --accent:#6c63ff;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
  --sidebar:240px;
  --theme-transition: background .25s,color .25s,border-color .25s,box-shadow .25s;
}
[data-theme="light"]{
  --bg:#f4f6fb;--surface:#ffffff;--surface2:#e8edf5;
  --border:#dde2ed;--text:#1a1d2e;--muted:#64748b;
}
*,*::before,*::after{transition:var(--theme-transition)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
input,textarea,select,button{font-family:inherit}
{% block extra_style %}{% endblock %}
</style>
</head>
<body>
{% if messages %}
<div style="position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px">
  {% for m in messages %}
  <div style="padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;
    background:{% if 'error' in m.tags %}rgba(239,68,68,.15){% else %}rgba(34,197,94,.15){% endif %};
    color:{% if 'error' in m.tags %}#ef4444{% else %}#22c55e{% endif %};
    border:1px solid {% if 'error' in m.tags %}rgba(239,68,68,.3){% else %}rgba(34,197,94,.3){% endif %}">
    {{ m }}
  </div>
  {% endfor %}
</div>
<script>setTimeout(()=>document.querySelectorAll('[style*="position:fixed"]').forEach(e=>e.remove()),3500)</script>
{% endif %}
{% block body %}{% endblock %}
</body>
</html>
